edition = "2023";
package jsontest;
message EditionJson {
  int32 implicit_value = 1 [features.field_presence = IMPLICIT];
  int32 explicit_value = 2;
  enum Open { ZERO = 0; ONE = 1; }
  enum Closed { option features.enum_type = CLOSED; CLOSED_ZERO = 0; CLOSED_ONE = 1; }
  Open open = 3;
  Closed closed = 4;
  message Payload { int32 value = 1; }
  Payload payload = 5 [features.message_encoding = DELIMITED];
}
