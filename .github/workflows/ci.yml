name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Reusable release validation must not cancel an in-progress release.
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 21]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: sbt
          cache-dependency-path: |
            **/*.sbt
            project/build.properties
            .scalafmt.conf
      - uses: sbt/setup-sbt@v1
      # Scala 3 requires Java 11; retain Java 8 coverage for Scala 2.
      - name: Compile and test Scala 2 on Java 8
        if: matrix.java == 8
        run: sbt '++2.12.21' test '++2.13.18' test
      - name: Compile and test all Scala versions
        if: matrix.java != 8
        run: sbt +test
      - name: Check binary compatibility for all Scala versions
        if: matrix.java == 11
        run: sbt +mimaReportBinaryIssues

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: 11
          distribution: temurin
          cache: sbt
          cache-dependency-path: |
            **/*.sbt
            project/build.properties
            .scalafmt.conf
      - uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt scalafmtCheckAll scalafmtSbtCheck

  # Single final job for mergify, including failed/cancelled dependencies.
  ci-passed:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, format]
    steps:
      - name: Require all checks to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$FORMAT_RESULT" = success
