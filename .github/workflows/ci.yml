name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Reusable release validation must not cancel an in-progress release.
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 21]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Java 8 test runtime
        if: matrix.java == 8
        uses: actions/setup-java@v6
        with:
          java-version: 8
          distribution: temurin
          architecture: x64
      - name: Set up build JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java == 8 && 11 || matrix.java }}
          distribution: temurin
          architecture: x64
          cache: sbt
          cache-dependency-path: |
            **/*.sbt
            project/build.properties
            .scalafmt.conf
      - uses: sbt/setup-sbt@v1
      # Build with JDK 11 (--release); execute all maintenance artifacts on Java 8.
      # Java 8 cannot read the argument files used by newer sbt versions.
      # Set only the forked JVM, leaving compilation on the build JDK.
      # Apply fork settings after each Scala switch so every test run uses Java 8.
      - name: Test maintenance bytecode on Java 8
        if: matrix.java == 8
        run: >-
          sbt -Dsbt.argsfile=false
          '++2.12.21'
          'set Test / fork := true'
          'set Test / forkOptions := (Test / forkOptions).value.withJavaHome(Some(file(sys.env("JAVA_HOME_8_X64"))))'
          test
          '++2.13.18'
          'set Test / fork := true'
          'set Test / forkOptions := (Test / forkOptions).value.withJavaHome(Some(file(sys.env("JAVA_HOME_8_X64"))))'
          test
          '++3.3.8'
          'set Test / fork := true'
          'set Test / forkOptions := (Test / forkOptions).value.withJavaHome(Some(file(sys.env("JAVA_HOME_8_X64"))))'
          test
      - name: Compile and test all Scala versions
        if: matrix.java != 8
        run: sbt +test
      - name: Check binary compatibility for all Scala versions
        if: matrix.java == 11
        run: sbt +mimaReportBinaryIssues

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: 11
          distribution: temurin
          cache: sbt
          cache-dependency-path: |
            **/*.sbt
            project/build.properties
            .scalafmt.conf
      - uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt scalafmtCheckAll scalafmtSbtCheck

  # Single final job for mergify, including failed/cancelled dependencies.
  ci-passed:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, format]
    steps:
      - name: Require all checks to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$FORMAT_RESULT" = success
